<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OrgChart Horizontal Template Options Demo</title>
  <link rel="icon" href="img/logo.png">
  <link rel="stylesheet" href="css/fontawesome.min.css">
  <link rel="stylesheet" href="css/orgchart.css">
  <link rel="stylesheet" href="css/style.css">
  <style type="text/css">
    #chart-container { height: min(620px, calc(100dvh - 110px)); min-height: 320px; }
    .orgchart { background: #fff; }
    .demo-notes a { color: #176b55; }
    .orgchart .node .avatar { float: left; width: 18px; height: 18px; margin: 1px 3px; object-fit: cover; border-radius: 3px; }
    .orgchart .node .edge::before { color: #176b55; }
  </style>
</head>
<body>
  <section class="demo-notes">
    <h1>Horizontal People Directory</h1>
    <p>Mixed options: horizontal layout, custom fields, template, icons and sibling toggles &middot; <a href="index.html">All demos</a></p>
  </section>
  <div id="chart-container"></div>
  <script type="text/javascript" src="js/orgchart.js"></script>
  <script type="text/javascript">
    document.addEventListener('DOMContentLoaded', () => {
      const datasource = {
        key: 'design-director', label: 'Lao Lao', role: 'Design director', office: 'Shanghai', avatar: '1.jpg',
        children: [
          { key: 'research-lead', label: 'Bo Miao', role: 'Research lead', office: 'Beijing', avatar: '2.jpg', children: [
            { key: 'researcher', label: 'Yu Jie', role: 'UX researcher', office: 'Beijing', avatar: '3.jpg' }
          ] },
          { key: 'experience-lead', label: 'Su Miao', role: 'Experience lead', office: 'Shanghai', avatar: '4.jpg', children: [
            { key: 'designer', label: 'Tie Hua', role: 'Product designer', office: 'Shanghai', avatar: '5.jpg' },
            { key: 'content-designer', label: 'Hei Hei', role: 'Content designer', office: 'Shanghai', avatar: '6.jpg' }
          ] },
          { key: 'systems-lead', label: 'Hong Miao', role: 'Design systems lead', office: 'Shenzhen', avatar: '7.jpg' }
        ]
      };

      const oc = new OrgChart({
        chartContainer: '#chart-container',
        data: datasource,
        direction: 'l2r',
        nodeId: 'key',
        nodeTitle: 'label',
        nodeContent: 'role',
        toggleSiblingsResp: true,
        pan: true,
        zoom: true,
        zoomoutLimit: 0.5,
        zoominLimit: 2,
        nodeTemplate: (data) => {
          return `<div class="title"><img class="avatar" src="img/avatar/${data.avatar}" alt="">${data.label}</div>
            <div class="content">${data.role}</div>`;
        },
        createNode: (node, data) => {
          node.dataset.office = data.office;
          node.title = data.label + ' - ' + data.role + ' - ' + data.office;
        },
        icons: {
          theme: 'fa-solid fa-sm',
          parentNode: 'fa-user-tie',
          expandToUp: 'fa-angles-up',
          collapseToDown: 'fa-angles-down',
          collapseToLeft: 'fa-angles-left',
          expandToRight: 'fa-angles-right',
          collapsed: 'fa-circle-plus',
          expanded: 'fa-circle-minus'
        }
      });

      oc.chartContainer.addEventListener('touchmove', (event) => {
        event.preventDefault();
      }, { passive: false });
    });
  </script>
</body>
</html>
