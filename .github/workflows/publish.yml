name: Publish Package

on:
  push:
    tags:
      - 'v*' # 当推送以 v 开头的标签（如 v2.0.0）时触发发布

# 1. 添加 OIDC 令牌所需的权限
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          
# npm 10.x (随 Node.js 22 自带) 已经足够新，无需升级
        
      - run: npm ci
      
      # 3. 直接运行 npm publish，无需任何令牌
      - run: npm publish --access public --provenance 