<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OrgChart Export Navigation Options Demo</title>
  <link rel="icon" href="img/logo.png">
  <link rel="stylesheet" href="css/orgchart.css">
  <link rel="stylesheet" href="css/style.css">
  <style type="text/css">
    #chart-container { height: min(620px, calc(100dvh - 110px)); min-height: 320px; }
    .orgchart.delivery-chart { background: #fff; }
    .demo-notes a { color: #176b55; }
    .delivery-chart .node[data-region="west"] .title { background-color: #176b55; }
    .delivery-chart .node[data-region="west"] .content { border-color: #176b55; }
    .delivery-chart .node[data-region="east"] .title { background-color: #a53f60; }
    .delivery-chart .node[data-region="east"] .content { border-color: #a53f60; }
    .oc-export-btn { right: 1rem; bottom: 1rem; top: auto; }
  </style>
</head>
<body>
  <section class="demo-notes">
    <h1>Regional Delivery</h1>
    <p>Mixed options: bottom-to-top layout, custom fields, styling, pan, zoom and PDF export &middot; <a href="index.html">All demos</a></p>
  </section>
  <div id="chart-container"></div>
  <script type="text/javascript" src="js/html2canvas.min.js"></script>
  <script type="text/javascript" src="js/jspdf.umd.min.js"></script>
  <script type="text/javascript" src="js/orgchart.js"></script>
  <script type="text/javascript">
    document.addEventListener('DOMContentLoaded', () => {
      const datasource = {
        key: 'delivery-director', employee: 'Lao Lao', role: 'Delivery director',
        children: [
          { key: 'west-manager', employee: 'Bo Miao', role: 'West manager', region: 'west', children: [
            { key: 'west-planning', employee: 'Tie Hua', role: 'Planning lead', region: 'west' },
            { key: 'west-logistics', employee: 'Yu Jie', role: 'Logistics lead', region: 'west' }
          ] },
          { key: 'east-manager', employee: 'Su Miao', role: 'East manager', region: 'east', children: [
            { key: 'east-planning', employee: 'Hei Hei', role: 'Planning lead', region: 'east' },
            { key: 'east-logistics', employee: 'Yu Li', role: 'Logistics lead', region: 'east' }
          ] }
        ]
      };

      const oc = new OrgChart({
        chartContainer: '#chart-container',
        data: datasource,
        chartClass: 'delivery-chart',
        direction: 'b2t',
        nodeId: 'key',
        nodeTitle: 'employee',
        nodeContent: 'role',
        pan: true,
        zoom: true,
        zoomoutLimit: 0.5,
        zoominLimit: 2,
        exportButton: true,
        exportButtonName: 'Export PDF',
        exportFilename: 'Regional-Delivery',
        exportFileextension: 'pdf',
        exportScale: 2,
        createNode: (node, data) => {
          if (data.region) {
            node.dataset.region = data.region;
          }
        }
      });

      oc.chartContainer.addEventListener('touchmove', (event) => {
        event.preventDefault();
      }, { passive: false });
    });
  </script>
</body>
</html>
