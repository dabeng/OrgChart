<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OrgChart Level Offset Demo</title>
  <link rel="icon" href="img/logo.png">
  <link rel="stylesheet" href="css/orgchart.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <section class="demo-notes">
    <h1>Level Offset Demo</h1>
    <p>This demo offsets selected nodes to specific levels so branches can intentionally break the default depth alignment.</p>
  </section>
  <div id="chart-container"></div>
  <script type="text/javascript" src="js/orgchart.js"></script>
  <script type="text/javascript">
    document.addEventListener('DOMContentLoaded', () => {

    const datasource = {
      'name': 'Lao Lao',
      'title': 'general manager',
      'children': [
        { 'name': 'Bo Miao', 'title': 'department manager', 'levelOffset': 1 },
        { 'name': 'Su Miao', 'title': 'department manager',
          'children': [
            { 'name': 'Tie Hua', 'title': 'senior engineer' },
            { 'name': 'Hei Hei', 'title': 'senior engineer',
              'children': [
                { 'name': 'Dan Dan', 'title': 'engineer' }
              ]
            },
            { 'name': 'Pang Pang', 'title': 'senior engineer', 'levelOffset': 1 }
          ]
        },
        { 'name': 'Hong Miao', 'title': 'department manager', 'levelOffset': 2 }
      ]
    };

    const oc = new OrgChart({
      chartContainer: '#chart-container',
      'data' : datasource,
      'nodeContent': 'title',
      'createNode': function(node, data) {
        if (data.levelOffset) {
          node.style.marginTop = (data.levelOffset * 70) + 'px';
          node.style.setProperty('--top', (-11 - data.levelOffset * 70) + 'px');
          node.style.setProperty('--height', (9 + data.levelOffset * 70) + 'px');
          node.style.setProperty('--top-cross-point', (-13 - data.levelOffset * 70) + 'px');
          node.style.setProperty('--height-cross-point', (11 + data.levelOffset * 70) + 'px');
        }
      }
    });

  });
  </script>
  </body>
</html>
