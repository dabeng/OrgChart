<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OrgChart Link Node Demo</title>
  <link rel="icon" href="img/logo.png">
  <link rel="stylesheet" href="css/orgchart.css">
  <link rel="stylesheet" href="css/style.css">
  <style type="text/css">
.orgchart .linkNode {
  box-sizing: border-box;
  display: inline-block;
  position: relative;
  margin: 0;
  text-align: center;
  width: 130px;
}

.orgchart .linkNode .linkLine {
  background-color: rgba(217, 83, 79, 0.8);
  height: 50px;
  width: 2px;
  margin: 0 auto;
}
  </style>
</head>
<body>
  <section class="demo-notes">
    <h1>Link Node Demo</h1>
    <p>This demo inserts connector-style intermediary nodes to visualize indirect relationships inside the hierarchy.</p>
  </section>
  <div id="chart-container"></div>
  <script type="text/javascript" src="js/orgchart.js"></script>
  <script type="text/javascript">
    document.addEventListener('DOMContentLoaded', () => {

    const datasource = {
      'name': 'Lao Lao',
      'title': 'general manager',
      'children': [
        { 'name': 'Bo Miao', 'title': 'department manager',
          'children': [
            { 'name': 'Li Xin', 'title': 'senior engineer',
              'children': [
                { 'name': 'Fei Fei', 'title': 'engineer' },
                { 'name': 'Xuan Xuan', 'title': 'engineer' }
              ]
            }
          ]
        },
        { 'name': 'Su Miao', 'title': 'department manager', 'linkNode': true,
          'children': [
            { 'name': 'Hei Hei', 'title': 'senior engineer',
              'children': [
                { 'name': 'Dan Dan', 'title': 'engineer' },
                { 'name': 'Zai Zai', 'title': 'engineer' }
              ]
            }
          ]
        }
      ]
    };

    const oc = new OrgChart({
      chartContainer: '#chart-container',
      'data' : datasource,
      'nodeContent': 'title'
    });

  });
  </script>
  </body>
</html>
