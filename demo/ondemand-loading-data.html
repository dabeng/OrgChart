<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OrgChart On-Demand Loading Demo</title>
  <link rel="icon" href="img/logo.png">
  <link rel="stylesheet" href="css/orgchart.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .request-control { position: absolute; width: 16px; height: 16px; padding: 0; border: 0; background: #fff; color: #1677ff; cursor: pointer; }
    .request-control:disabled { cursor: wait; opacity: 0.5; }
    .request-parent { top: -2px; left: calc(50% - 8px); background: transparent; }
    .request-siblings { left: -2px; top: calc(50% - 8px); background: transparent; }
    .request-children { bottom: -2px; left: calc(50% - 8px); background: transparent; }
    .request-control > .oci { pointer-events: none; }
    .request-control > .oci::before { border-color: currentColor; }
  </style>
</head>
<body>
  <section class="demo-notes">
    <h1>On-Demand Loading Demo</h1>
    <p>This demo loads ancestors and descendants only when users expand the corresponding branches.</p>
  </section>
  <div id="chart-container"></div>
  <script type="text/javascript" src="js/orgchart.js"></script>
  <script type="text/javascript">
    document.addEventListener('DOMContentLoaded', () => {

    const responseMap = {
      '/orgchart/ancestors/n1': { 
        'id': 'n0',
        'name': 'Lao Lao',
        'title': 'general manager',
        'children': [
        { 'id': 'n10','name': 'Bo Miao', 'title': 'department engineer' },
        { 'id': 'n11', 'name': 'Yu Jie', 'title': 'department engineer' },
        { 'id': 'n12', 'name': 'Yu Li', 'title': 'department engineer' },
        { 'id': 'n13', 'name': 'Hong Miao', 'title': 'department engineer' },
        { 'id': 'n14', 'name': 'Yu Wei', 'title': 'department engineer' },
        { 'id': 'n15', 'name': 'Chun Miao', 'title': 'department engineer' },
        { 'id': 'n16', 'name': 'Yu Tie', 'title': 'department engineer' }
        ]
      },
      '/orgchart/descendants/n2': [
        { 'id': 'n4', 'name': 'Xiang Xiang', 'title': 'engineer' }
      ],
      '/orgchart/descendants/n3': [
        { 'id': 'n5', 'name': 'Pang Pang', 'title': 'engineer',
          'children': [
            { 'id': 'n6', 'name': 'Er Dan', 'title': 'UE engineer' }
          ]
        },
        { 'id': 'n7', 'name': 'Dan Dan', 'title': 'engineer' }
      ]
    };

    const requestJson = (url) => new Promise((resolve) => {
      window.setTimeout(() => resolve(JSON.parse(JSON.stringify(responseMap[url]))), 1000);
    });
    const completedRequests = new Set();
    const pendingRequests = new Set();
    const removingRequestButtons = new WeakSet();
    const requestUrl = (node, relation) => '/orgchart/'
      + (relation === 'children' ? 'descendants/' : 'ancestors/') + node.id;
    const removeRequestButtons = (node) => {
      if (removingRequestButtons.has(node)) {
        return;
      }
      removingRequestButtons.add(node);
      try {
        node.querySelectorAll(':scope > .request-control').forEach((button) => button.remove());
      } finally {
        removingRequestButtons.delete(node);
      }
    };
    const renderRequestButtons = (node) => {
      [
        { relation: 'parent', icon: 'oci-chevron-up', label: 'Load ancestors' },
        { relation: 'siblings', icon: 'oci-chevron-left', label: 'Load siblings' },
        { relation: 'children', icon: 'oci-chevron-down', label: 'Load children' }
      ].forEach(({ relation, icon, label }) => {
        const url = requestUrl(node, relation);
        const existingButton = node.querySelector(':scope > .request-' + relation);
        if (!Object.prototype.hasOwnProperty.call(responseMap, url)
          || completedRequests.has(url) || oc.getNodeState(node, relation).exist) {
          if (existingButton) {
            removeRequestButtons(node);
          }
          return;
        }
        if (existingButton) {
          existingButton.disabled = pendingRequests.has(url);
          return;
        }
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'request-control request-' + relation;
        button.dataset.relation = relation;
        button.title = label;
        button.setAttribute('aria-label', label);
        button.disabled = pendingRequests.has(url);
        button.innerHTML = '<i class="oci ' + icon + '"></i>';
        node.appendChild(button);
      });
    };

    const datasource = {
      'id': 'n1',
      'name': 'Su Miao',
      'title': 'department manager',
      'children': [
        { 'id': 'n2','name': 'Tie Hua', 'title': 'senior engineer' },
        { 'id': 'n3','name': 'Hei Hei', 'title': 'senior engineer' }
      ]
    };

    const oc = new OrgChart({
      chartContainer: '#chart-container',
      'data' : datasource,
      'nodeContent': 'title',
      'nodeId': 'id',
      createNode: (node) => {
        node.addEventListener('mouseenter', () => renderRequestButtons(node));
        node.addEventListener('mouseleave', () => {
          if (!node.contains(document.activeElement)) {
            removeRequestButtons(node);
          }
        });
        node.addEventListener('focusin', (event) => {
          if (event.target === node) {
            renderRequestButtons(node);
          }
        });
        node.addEventListener('focusout', (event) => {
          if (!node.contains(event.relatedTarget) && !node.matches(':hover')) {
            removeRequestButtons(node);
          }
        });
      }
    });

    const chartElement = document.getElementById('chart-container');
    chartElement.addEventListener('click', async (event) => {
      const button = event.target.closest('.request-control');
      if (!button || !chartElement.contains(button)) {
        return;
      }
      const node = button.parentElement;
      const relation = button.dataset.relation;
      const url = requestUrl(node, relation);
      if (pendingRequests.has(url) || completedRequests.has(url)) {
        return;
      }
      pendingRequests.add(url);
      renderRequestButtons(node);
      node.setAttribute('aria-busy', 'true');
      const spinner = document.createElement('i');
      spinner.className = 'oci oci-spinner spinner';
      node.appendChild(spinner);
      let failed = false;
      try {
        const data = await requestJson(url);
        if (!oc.chart.contains(node)) {
          return;
        }
        if (relation === 'children') {
          if (data.length) {
            oc.addDescendants(data, node);
          }
        } else if (data) {
          oc.addAncestors(data, data.id);
          oc.refreshNodeControls(document.getElementById(data.id));
        }
        completedRequests.add(url);
      } catch (error) {
        failed = true;
      } finally {
        pendingRequests.delete(url);
        spinner.remove();
        node.removeAttribute('aria-busy');
        removeRequestButtons(node);
        if (node.matches(':hover') || node.contains(document.activeElement)) {
          renderRequestButtons(node);
          if (failed) {
            node.querySelectorAll(':scope > .request-control').forEach((retryButton) => {
              retryButton.title = 'Request failed. Click to retry.';
            });
          }
        }
      }
    });

    });
  </script>
  </body>
</html>
