<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OrgChart Toggle Siblings Demo</title>
  <link rel="icon" href="img/logo.png">
  <link rel="stylesheet" href="css/orgchart.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <section class="demo-notes">
    <h1>Toggle Siblings Demo</h1>
    <p>This demo lets users collapse and expand left and right sibling groups independently.</p>
  </section>
  <div id="chart-container"></div>
  <script type="text/javascript" src="js/orgchart.js"></script>
  <script type="text/javascript">
    document.addEventListener('DOMContentLoaded', () => {

    const datasource = {
      'name': 'Lao Lao',
      'title': 'general manager',
      'children': [
        { 'name': 'Bo Miao', 'title': 'department manager',
          'children': [
            { 'name': 'Ren Wu', 'title': 'senior engineer' },
            { 'name': 'Li Xin', 'title': 'senior engineer' }
          ]
        },
        { 'name': 'Su Miao', 'title': 'department manager' },
        { 'name': 'Hong Miao', 'title': 'department manager',
          'children': [
            { 'name': 'Xing An', 'title': 'senior engineer' },
            { 'name': 'Yi Dian', 'title': 'senior engineer' }
          ]
        }
      ]
    };

    const oc = new OrgChart({
      chartContainer: '#chart-container',
      'data' : datasource,
      'nodeContent': 'title',
      'toggleSiblingsResp': true
    });

  });
  </script>
  </body>
</html>
