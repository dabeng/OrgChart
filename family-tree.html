<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OrgChart Family Tree Demo</title>
  <link rel="icon" href="img/logo.png">
  <link rel="stylesheet" href="css/orgchart.css">
  <link rel="stylesheet" href="css/style.css">
  <style type="text/css">
    .orgchart { background: #fff; }
    #chart-container {
      height: 850px;
    }
    .orgchart .node {
      padding: 3px 8px;
    }
    .orgchart .node .avatar {
      border-radius: 60px;
      box-shadow: rgba(99, 99, 99, 0.8) 0px 2px 8px 0px;
    }
    .orgchart .couple:has(> .nodes) > .node:first-child::after {
      top: 148px;
    }
    .orgchart .couple::after  {
      top: 148px;
      width: 30px;
      left: calc(50% - 15px);
    }
    .orgchart .couple:first-child:not(:only-child)::before {
      width: calc(100% - 74px);
      left: 74px;
    }
    .orgchart .hierarchy.couple:only-child::before {
      width: 152px;
      left: calc(50% - 76px);
    }
    .orgchart .couple:last-child:not(:only-child)::before {
      width: calc(50% + 76px);
    }
  </style>
</head>
<body>
  <section class="demo-notes">
    <h1>Family Tree Demo</h1>
    <p>This demo uses the family-tree datasource format to render spouses, descendants, and pedigree relationships.</p>
  </section>
  <div id="chart-container"></div>
  <script type="text/javascript" src="js/orgchart.js"></script>
  <script type="text/javascript">
    document.addEventListener('DOMContentLoaded', () => {

      const datasource = [
        [
          { 'id': '8', 'name': 'Lao Ye', 'title': 'Grandfather', 'gender': 'male' },
          { 
            'id': '1', 'name': 'Lao Lao', 'title': 'Grandmother', 'gender': 'female', 'outsider': true,
            'children': [
              [
                { 'id': '2', 'name': 'Bo miao', 'title': 'Aunt', 'gender': 'female'}
              ],
              [
                { 'id': '3', 'name': 'Su Miao', 'title': 'Mother', 'gender': 'female',
                  'children': [
                    [
                    
                      { 'id': '12', 'name': 'Pang Pang', 'title': 'Wife', 'gender': 'female', 'outsider': true,
                        'children': [
                          [{ 'id': '7', 'name': 'Dan Dan', 'title': 'Daughter', 'gender': 'female' }],
                          [{ 'id': '6', 'name': 'Er Dan', 'title': 'Daughter', 'gender': 'female' }],
                        ]
                      },
                      { 'id': '5', 'name': 'Hei Hei', 'title': 'Me', 'gender': 'male' },
                    ]
                  ]
                },
                { 'id': '9', 'name': 'Tie Hua', 'title': 'Father', 'gender': 'male', 'outsider': true }
              ],
              [
                { 'id': '10', 'name': 'Hong miao', 'title': 'Aunt', 'gender': 'female'}
              ]
            ]
          }
        ]
      ];

    const oc = new OrgChart({
      chartContainer: '#chart-container',
      'data' : datasource,
      'nodeContent': 'title',
      'nodeID': 'id',
      'createNode': function(node, data) {
        node.insertAdjacentHTML('afterbegin', `<img class="avatar" src="https://dabeng.github.io/OrgChart/img/avatar/${data.id}.jpg" crossorigin="anonymous" />`);
      }
    });


  });
  </script>
  </body>
</html>
